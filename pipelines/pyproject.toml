[project]
name = "ledger-lens-pipelines"
version = "0.1.0"
description = "Ledger Lens extraction pipeline — extraction flows (Prefect on the full stack) for OCR, spec induction, deterministic parsing, and reconciliation."
requires-python = ">=3.11"
# Install alongside the backend package: pip install -e backend -e pipelines
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Prefect orchestration for the full stack (RabbitMQ queue backend).
orchestration = [
    "prefect>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger_lens_pipelines*"]
