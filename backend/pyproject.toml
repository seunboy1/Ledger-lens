[project]
name = "ledger-lens-backend"
version = "0.1.0"
description = "Ledger Lens backend — ingestion API, retrieval API, extraction pipeline support."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "minio>=7.2",
    "aio-pika>=9.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# LangGraph agent for Ask (any OpenAI-compatible model endpoint).
agent = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]
# MCP server exposing the workspace to MCP clients (Claude Desktop, Claude Code, IDEs).
mcp = [
    "mcp>=2.0",
]
# pgvector embeddings for the semantic path (full stack, EMBEDDINGS_ENABLED=true).
embeddings = [
    "sentence-transformers>=3.0",
]
# Local single-machine profile: SQLite + synthetic demo statements.
local = [
    "aiosqlite>=0.20",
    "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
